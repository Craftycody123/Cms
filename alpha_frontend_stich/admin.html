<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha | Admin Dashboard</title>
<script>
  window.APP_CONFIG = window.APP_CONFIG || {};
  window.APP_CONFIG.API_BASE = 'https://cms-rr1p.onrender.com';
  window.APP_CONFIG.ADMIN_PATH = '/admin';
</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Work+Sans:wght@500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/output.css">
<style>
  body { background-color:#141313; margin:0; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; }
  .page-bg-fixed { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-20; background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDTbAOF8jyit9Ule_XlD-x2uReeC9SM1ih7NJMgH3rnSMvsuTxff9lmq8CitkF_SrYAwEw23fb2J9y9PnwhSmnl9TMT1CrGAtGkLsFKPr-aNfKwjuvly0G8NP0r7Xm7UGopZnhH3tSV7XwxtMVDtOOEj10H82rN8TiadcMMFg7h_ATOTdvz6v387AvmrdBQCIu2-mTvfvDAd5DBW16jT_Fes8EMzMc-mq11KgP533Mfqip9enEog_82RWLurNOTxHbmy0O-OlMQxEE'); background-size:cover; background-position:center; background-attachment:fixed; filter:brightness(0.4); }
  .laurel-glass { background: rgba(181,191,161,0.08); backdrop-filter: blur(32px); border: 1px solid rgba(181,191,161,0.2); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
  .input-focus-border:focus { outline:none; border-color:#B5BFA1; }
  .material-symbols-outlined { font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24; vertical-align:middle; }
  .tab-button { padding:12px 24px; background:transparent; color:#fff; border:none; cursor:pointer; font-weight:bold; transition:all 0.3s; border-bottom:2px solid transparent; }
  .tab-button.active { border-color:#B5BFA1; color:#B5BFA1; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .admin-header { background:rgba(0,0,0,0.4); backdrop-filter:blur(32px); border-bottom:1px solid rgba(181,191,161,0.2); padding:20px; }
  .service-card-admin { border: 1px solid rgba(181,191,161,0.3); border-radius: 0.75rem; display: flex; flex-direction: column; }
  .service-card-admin.has-image { padding: 1.5rem; }
  .service-card-admin:not(.has-image) { padding: 0.75rem; min-height: auto; height: fit-content; }
  .service-card-image { width: 100%; height: 200px; object-fit: contain; background-color: rgba(0,0,0,0.2); border-radius: 0.5rem 0.5rem 0; }
  .image-preview-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .image-preview-modal img { max-width: 90%; max-height: 90%; border-radius: 1rem; }
</style>
</head>
<body class="text-white font-body-md">
<div class="page-bg-fixed"></div>

<!-- Login Form (shown when not authenticated) -->
<div id="login-container" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md laurel-glass rounded-xl p-8 md:p-12 relative overflow-hidden">
    <div class="relative z-10 text-center mb-10">
      <h1 class="font-display-lg text-white mb-2 font-bold text-4xl">Admin Login</h1>
      <p class="text-white/70 text-sm">Enter your credentials to manage the site</p>
    </div>
    <form id="login-form" class="space-y-6 relative z-10">
      <div class="space-y-3">
        <label class="block font-accent-label text-accent-label font-bold text-laurel-green tracking-wider uppercase text-sm">Email</label>
        <input type="email" id="login-email" class="w-full bg-white/5 border-0 border-b-2 py-4 px-2 focus:ring-0 input-focus-border text-white placeholder:text-white/30 border-white/20" placeholder="admin@example.com" required>
      </div>
      <div class="space-y-3">
        <label class="block font-accent-label text-accent-label font-bold text-laurel-green tracking-wider uppercase text-sm">Password</label>
        <input type="password" id="login-password" class="w-full bg-white/5 border-0 border-b-2 py-4 px-2 focus:ring-0 input-focus-border text-white border-white/20" placeholder="••••••••" required>
      </div>
      <div class="pt-4">
        <button type="submit" class="w-full bg-laurel-green text-black font-accent-label font-bold py-5 px-8 hover:bg-opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-4 group rounded">
          <span class="uppercase tracking-widest">Sign In</span>
          <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </div>
      <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
    </form>
    <div class="mt-8 flex justify-center">
      <div class="h-1 w-12 bg-laurel-green/30 rounded-full"></div>
    </div>
  </div>
</div>

<!-- Dashboard (shown when authenticated) -->
<div id="dashboard-container" class="hidden flex-col min-h-screen">
  <div class="admin-header">
    <div class="max-w-container-max mx-auto px-4 flex justify-between items-center">
      <div class="font-headline-md text-headline-md font-bold text-white flex items-center gap-2">
        Alpha Admin <span class="w-3 h-3 bg-laurel-green inline-block rotate-45"></span>
      </div>
      <div class="flex items-center gap-6">
        <span id="current-user" class="text-white/70">Loading...</span>
        <button id="logout-btn" class="bg-red-500/20 text-red-400 px-4 py-2 rounded hover:bg-red-500/30 transition">
          Logout
        </button>
      </div>
    </div>
  </div>
  <div class="flex-grow flex overflow-hidden">
    <div class="w-full max-w-7xl mx-auto p-6">
    <div class="laurel-glass rounded-lg overflow-hidden h-full flex flex-col">
      <!-- Tab Navigation -->
      <div class="flex border-b border-white/10">
        <button class="tab-button active" data-tab="inquiries">Inquiries</button>
        <button class="tab-button" data-tab="services">Services</button>
        <button class="tab-button" data-tab="portfolio">Portfolio</button>
        <button class="tab-button" data-tab="team">Team</button>
        <button class="tab-button" data-tab="settings">Settings</button>
      </div>

      <!-- Tab Contents -->
      <div class="flex-grow overflow-y-auto p-8">
        <!-- Inquiries Tab -->
        <div class="tab-content active" data-tab-content="inquiries">
          <h2 class="text-2xl font-bold text-white mb-6">Contact Inquiries</h2>
          <div id="inquiries-list" class="space-y-4">
            <p class="text-white/70">Loading inquiries...</p>
          </div>
        </div>

        <!-- Services Tab -->
        <div class="tab-content" data-tab-content="services">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">Services Management</h2>
            <button onclick="ServicesCMS.createService()" class="bg-laurel-green text-black px-6 py-2 font-bold rounded hover:bg-opacity-90 transition">
              + Add Service
            </button>
          </div>
          <div id="services-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-white/70">Loading services...</p>
          </div>
        </div>

        <!-- Portfolio Tab -->
        <div class="tab-content" data-tab-content="portfolio">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">Portfolio Management</h2>
            <button onclick="PortfolioCMS.createPortfolio()" class="bg-laurel-green text-black px-6 py-2 font-bold rounded hover:bg-opacity-90 transition">
              + Add Portfolio Item
            </button>
          </div>
          <div id="portfolio-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-white/70">Loading portfolio...</p>
          </div>
        </div>

        <!-- Team Tab -->
        <div class="tab-content" data-tab-content="team">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">Team Management</h2>
            <button onclick="TeamCMS.createMember()" class="bg-laurel-green text-black px-6 py-2 font-bold rounded hover:bg-opacity-90 transition">
              + Add Team Member
            </button>
          </div>
          <div id="team-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <p class="text-white/70">Loading team...</p>
          </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" data-tab-content="settings">
          <h2 class="text-2xl font-bold text-white mb-6">Site Settings</h2>
          <div class="laurel-glass p-6 rounded">
            <p class="text-white/70">Settings management coming soon...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js?v=6"></script>
<script src="/js/api.js?v=6"></script>
<script src="/js/auth.js?v=6"></script>
<script src="/js/modal-form.js?v=6"></script>
<script src="/js/services-cms.js?v=6"></script>
<script src="/js/portfolio-cms.js?v=6"></script>
<script src="/js/team-cms.js?v=6"></script>
<script src="/js/admin-dashboard.js?v=6"></script>
</body>
</html>
